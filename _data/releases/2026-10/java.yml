- Name: com.azure+azure-core-http-vertx
  Version: 1.2.0
  DisplayName: azure-core-http-vertx
  ServiceName: Other
  VersionType: GA
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-java/tree/com.azure+azure-core-http-vertx_1.2.0/sdk/core/azure-core-http-vertx/CHANGELOG.md
  ChangelogContent: |-
    #### Features Added
    - Requests carrying the `Expect: 100-continue` header now perform the handshake: the headers are sent with
    `sendHead()` and the request body is written from `continueHandler()`, rather than sending headers and body
    together.
    If the service does not answer the expectation the body is sent after a one second fallback, so the request does
    not stall.
  GroupId: com.azure
