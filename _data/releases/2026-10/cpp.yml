entries:
- Name: azure-storage-common
  Version: 12.15.0
  DisplayName: Storage - Common
  ServiceName: Storage
  VersionType: GA
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-cpp/tree/azure-storage-common_12.15.0/sdk/storage/azure-storage-common/CHANGELOG.md
  ChangelogContent: |-
    #### Bugs Fixed

    - Added a missing `<cstdint>` include, fixing the build with GCC 13 and later.

    #### Features Added

    - Features in `12.15.0-beta.1` are now generally available.
- Name: azure-storage-blobs
  Version: 12.19.0
  DisplayName: Storage - Blobs
  ServiceName: Storage
  VersionType: GA
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-cpp/tree/azure-storage-blobs_12.19.0/sdk/storage/azure-storage-blobs/CHANGELOG.md
  ChangelogContent: |-
    #### Bugs Fixed

    - Fixed CR/LF injection through request targets and header values in Blob Batch subrequests.

    #### Features Added

    - Features in `12.19.0-beta.1` are now generally available.

