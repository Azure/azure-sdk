- Name: azure-keyvault-certificates
  Version: 4.11.3
  DisplayName: Key Vault - Certificates
  ServiceName: Key Vault
  VersionType: Patch
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-python/tree/azure-keyvault-certificates_4.11.3/sdk/keyvault/azure-keyvault-certificates/CHANGELOG.md
  ChangelogContent: |-
    #### Bugs Fixed

    - Reject request URLs containing backslashes in the authority before authentication.
    - Verify cached authentication challenges before token use and clear rejected or malformed challenges without removing newer entries installed by concurrent requests.
