- Name: Azure.Messaging.WebPubSub.Chat
  Version: 1.0.0-beta.1
  DisplayName: Web PubSub Chat
  ServiceName: Web PubSub
  VersionType: Beta
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-net/tree/Azure.Messaging.WebPubSub.Chat_1.0.0-beta.1/sdk/webpubsub/Azure.Messaging.WebPubSub.Chat/CHANGELOG.md
  ChangelogContent: |-
    #### Features Added

    - Initial beta release of the Azure Web PubSub Chat client library for .NET.
    - Added `WebPubSubChatServiceClient` with support for connection string, `AzureKeyCredential`, and Microsoft Entra ID (`TokenCredential`) authentication.
    - Added management of chat rooms, room members, users, and roles.
    - Added reading of message history from a conversation, and updating and deleting messages.
    - Added `GetClientAccessUri` to generate a client access URI for connecting to the service.
    - Added generated extensible chat permissions (`ChatPermission`) and built-in roles (`BuiltInChatRoles`).
- Name: Azure.AI.ContentSafety
  Version: 1.1.0-beta.1
  DisplayName: Content Safety
  ServiceName: Cognitive Services
  VersionType: Beta
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-net/tree/Azure.AI.ContentSafety_1.1.0-beta.1/sdk/contentsafety/Azure.AI.ContentSafety/CHANGELOG.md
  ChangelogContent: |-
    #### Features Added

    - Added `UnifiedModerate` and `UnifiedModerateAsync` operations for the `2026-09-01-preview` service API.
    - Exposed `JsonModelWriteCore` for model serialization procedure.
    - Added `ContentSafetyClientSettings` to support creating a `ContentSafetyClient` from `IConfiguration`, including configuration-based credential resolution and dependency injection registration.
    - Added `BlocklistClientSettings` to support creating a `BlocklistClient` from `IConfiguration`, including configuration-based credential resolution and dependency injection registration.
- Name: Azure.AI.Projects
  Version: 3.0.0-beta.3
  DisplayName: AI Foundry
  ServiceName: Cognitive Services
  VersionType: Beta
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-net/tree/Azure.AI.Projects_3.0.0-beta.3/sdk/ai/Azure.AI.Projects/CHANGELOG.md
  ChangelogContent: |-
    #### Features Added
    - Added `ProjectsRealtimeClient` and `ProjectsRealtimeSessionClient` to work with voice agents. `AIProjectClient.ProjectsRealtimeClient` gets a `ProjectsRealtimeClient`; calling `StartSessionAsync(model, intent, options, cancellationToken)` on it -- the same method used with OpenAI's own `RealtimeClient` -- connects a `ProjectsRealtimeSessionClient` to the named voice agent's realtime endpoint (`/agents/{agentName}/endpoint/protocols/voice`). Pass `store=true`/`store=false` via `options.QueryString` to control whether the session's conversation is persisted. `ProjectsRealtimeClient` is also available when `AIProjectClient` is constructed from an `AIProjectClientSettings` whose credential resolves a token provider.

    #### Breaking Changes
    - `MaxSamples` member was removed from `DataGenerationJobOptions`.
    - `AIProjectClient.GetProjectsRealtimeSessionClient(string, string)` and its replacement `GetProjectsRealtimeSessionClientAsync(string, string, bool?, CancellationToken)` were both removed in favor of `AIProjectClient.ProjectsRealtimeClient.StartSessionAsync(string, string, RealtimeSessionClientOptions, CancellationToken)`, reusing OpenAI's own `RealtimeClient.StartSessionAsync` method rather than introducing a separate one.
    - `ProjectsRealtimeSessionClient`'s public constructor was removed. An instance constructed through it could never become connected (its `ConnectAsync` override is only reachable through `ProjectsRealtimeClient.StartSessionAsync`), so it offered no working standalone use; call `AIProjectClient.ProjectsRealtimeClient.StartSessionAsync` to obtain an already-connected instance instead.
