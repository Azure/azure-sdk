- Name: '@azure/communication-identity'
  Version: 2.0.0
  DisplayName: Communication Identity
  ServiceName: Communication
  VersionType: GA
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-js/tree/@azure/communication-identity_2.0.0/sdk/communication/communication-identity/CHANGELOG.md
  ChangelogContent: |-
    #### Features Added

    - Added a new API version `2026-09-23` that is now the default API version.

    #### Breaking Changes

    > The two changes below remove surface that only ever shipped in
    > `1.4.0-beta.1`. The last stable release, `1.3.1`, is unaffected by them.

    - Removed `CommunicationIdentityClient.getUserDetail` and the
    `CommunicationUserDetail` type. The backing `GET /identities/{id}` operation
    does not exist in the `2026-09-23` API version.
    - Removed `customId` from `CreateUserOptions` and `CreateUserAndTokenOptions`.
    The `2026-09-23` API version does not support it.
