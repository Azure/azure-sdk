- Name: Azure.AI.Projects.Agents
  Version: 3.0.0-beta.4
  DisplayName: AI Projects - Agents
  ServiceName: Cognitive Services
  VersionType: Beta
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-net/tree/Azure.AI.Projects.Agents_3.0.0-beta.4/sdk/ai/Azure.AI.Projects.Agents/CHANGELOG.md
  ChangelogContent: |-
    #### Features Added
    - Expanded Agent Optimization with cost estimation, a dedicated candidate-listing client, and new models for optimization configuration, evaluation sets, candidate mutations, results, token usage, and latency metrics.
    - Added toolbox support for browser automation tool, and added external web access configuration for web-search toolbox tools.
    - Added language and keyword metadata to voice telephony call records.
    - Added support for starting an agent's initiated process from a memory snapshot.

    #### Breaking Changes
    - Redesigned the Agent Optimization API and model hierarchy. Job creation now uses optimization model and configuration objects, job listings return `AgentOptimizationJob`, and the previous dataset input, job input, options, progress, and list-item models were removed.
    - Renamed the Teams Phone Extension telephony APIs to Teams Phone Extensibility and renamed `MCPToolboxToolConnectorId` to `McpToolConnectorId`.
    - Replaced voice response status, output modality, semantic VAD eagerness, and web-search context-size types with the corresponding shared OpenAI types.
    - Moved `CallableToolAllowedCaller`, `VoiceAgentAudioInputConfigTranscriptionDelay`, `RealtimeFunctionToolParameters`, `ContainerSkill`, `InlineSkillParam`, `InlineSkillSourceParam`, and `SkillReferenceParam` from the `OpenAI` namespace to `Azure.AI.Projects.Agents`.
- Name: Azure.AI.Projects
  Version: 3.0.0-beta.4
  DisplayName: AI Foundry
  ServiceName: Cognitive Services
  VersionType: Beta
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-net/tree/Azure.AI.Projects_3.0.0-beta.4/sdk/ai/Azure.AI.Projects/CHANGELOG.md
  ChangelogContent: |-
    #### Features Added
    - `EvaluatorGenerationJobs` and `DataGenerationJob` do not require warning suppression anymore.
    - Agent optimization does not require `AAIP001` warning suppression anymore.

    #### Breaking Changes
    - `EvaluatorGenerationJobs.Create` and `EvaluatorGenerationJobs.CreateAsync` are now returning the LRO poller.
    - To create a data generation job, `DataGenerationJobInputs` is now need to be used. It can be of three types: `EvaluationDataGenerationJobInputs`, `ReinforcementFineTuningDataGenerationJobInputs` and `SupervisedFineTuningDataGenerationJobInputs`.
    - `DataGenerationJobOptions` was replaced by `DataGenerationJobConfiguration` subtypes.
    - `DataGenerationJobOutputOptions` was replaced by `EvaluationDataGenerationJobOutputConfiguration`.
    - The `EvaluatorName` property of `EvaluatorGenerationInputs` now can only be set through constructor.
