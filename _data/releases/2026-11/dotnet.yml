- Name: Microsoft.Azure.WebPubSub.AspNetCore
  Version: 1.6.0
  DisplayName: Microsoft.Azure.WebPubSub.AspNetCore
  ServiceName: Web PubSub
  VersionType: GA
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-net/tree/Microsoft.Azure.WebPubSub.AspNetCore_1.6.0/sdk/webpubsub/Microsoft.Azure.WebPubSub.AspNetCore/CHANGELOG.md
  ChangelogContent: |-
    #### Bugs Fixed
    - Fixed inbound request signature validation being skipped when the service endpoint was configured with the `WebPubSubServiceEndpoint(Uri, AzureKeyCredential, ...)` constructor. The supplied key is now used to validate `ce-signature`, and credential rotation via `AzureKeyCredential.Update` is honored.

    #### Features Added
    - Support handling group presence events.
