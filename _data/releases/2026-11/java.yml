- Name: com.azure+azure-core-http-okhttp
  Version: 1.14.0
  DisplayName: Core - Client - HTTP OkHttp
  ServiceName: Other
  VersionType: GA
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-java/tree/com.azure+azure-core-http-okhttp_1.14.0/sdk/core/azure-core-http-okhttp/CHANGELOG.md
  ChangelogContent: |-
    #### Bugs Fixed

    - Fixed timeout resolution to prefer explicit builder values, then builder-specific configuration, then global
    configuration, and finally SDK defaults. Nonpositive call timeouts now disable the timeout instead of rejecting
    negative values.
    - Prevented proxy authentication retries for HTTPS endpoint 407 responses while preserving CONNECT and cleartext HTTP proxy authentication.
    - Fixed response timeouts remaining active while reading the response body after an `Expect: 100-continue` handshake.
  GroupId: com.azure
- Name: com.azure+azure-core-http-netty
  Version: 1.17.0
  DisplayName: Core - Client - HTTP Netty
  ServiceName: Other
  VersionType: GA
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-java/tree/com.azure+azure-core-http-netty_1.17.0/sdk/core/azure-core-http-netty/CHANGELOG.md
  ChangelogContent: |-
    #### Features Added
    - Added opt-in observation of the `Expect: 100-continue` handshake. When a caller places an `AtomicBoolean` in the
    request `Context` under the key `azure-http-client-expect-continue-received`, the client sets it to `true` if the
    service answers with an interim `100 Continue` response. This does not change how or when the request body is sent.

    #### Bugs Fixed

    - Fixed asynchronous response downloads blocking Netty event-loop threads while waiting for destination writes.
    Response bytes are copied to heap buffers so pending writes remain safe after Netty releases its network buffers.
    - Fixed timeout resolution to prefer explicit builder values, then builder-specific configuration, then global
    configuration, and finally SDK defaults.
    - Preserved asynchronous file downloads when Netty uses scoped direct buffers on newer JDKs.
    - Declared the Netty transport dependency directly to prevent older transitive transports from being selected.
    - Fixed response and read timeouts not being enforced when the write timeout is disabled.
  GroupId: com.azure
