entries:
- Name: azure_security_keyvault_keys
  Version: 1.1.0-beta.1
  DisplayName: Key Vault - Keys
  ServiceName: Key Vault
  VersionType: Beta
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-rust/tree/azure_security_keyvault_keys@1.1.0-beta.1/sdk/keyvault/azure_security_keyvault_keys/CHANGELOG.md
  ChangelogContent: |-
    #### Features Added

    - Upgraded to API service version `2026-03-01-preview`.

    #### Bugs Fixed

    - Fixed challenge authentication to cache challenge scopes only after challenge resource verification succeeds, preventing
    rejected challenges from being reused by later requests.
