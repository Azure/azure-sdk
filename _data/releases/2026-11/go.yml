- Name: sdk/azidentity
  Version: 1.15.0
  DisplayName: Identity
  ServiceName: Identity
  VersionType: GA
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-go/tree/sdk/azidentity/v1.15.0/sdk/azidentity/CHANGELOG.md
  ChangelogContent: |-
    #### Features Added

    - `ManagedIdentityCredential` and `DefaultAzureCredential` support user-assigned managed identities
    on Azure Arc when the agent supports them
    - `WorkloadIdentityCredential` supports identity binding mode via `WorkloadIdentityCredentialOptions.EnableAzureProxy`

    #### Bugs Fixed

    - `ManagedIdentityCredential` verifies the Service Fabric endpoint's certificate against
    `IDENTITY_SERVER_THUMBPRINT` and rejects redirects
- Name: sdk/data/azcosmos
  Version: 1.6.0-beta.4
  DisplayName: Cosmos DB
  ServiceName: Cosmos DB
  VersionType: Beta
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-go/tree/sdk/data/azcosmos/v1.6.0-beta.4/sdk/data/azcosmos/CHANGELOG.md
  ChangelogContent: |-
    #### Bugs Fixed

    * Fixed eligible read requests not retrying after `RetryOptions.TryTimeout` expires. The existing azcore retry policy continues to control caller cancellation, retry limits, and delays. Downstream non-retriable errors are preserved for all operations without enabling additional write retries. See [PR 27753](https://github.com/Azure/azure-sdk-for-go/pull/27753).
