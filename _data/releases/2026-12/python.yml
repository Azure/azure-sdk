- Name: azure-messaging-webpubsubchatservice
  Version: 1.0.0b2
  DisplayName: Web PubSub Chat
  ServiceName: Web PubSub
  VersionType: Beta
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-python/tree/azure-messaging-webpubsubchatservice_1.0.0b2/sdk/webpubsub/azure-messaging-webpubsubchatservice/CHANGELOG.md
  ChangelogContent: |-
    #### Features Added

    - Added topic lifecycle operations (create or replace, list, get, update, and soft delete). Creation or replacement accepts `ChatTopicCreateOrReplace`, which requires `title` and accepts optional `state` for replacement; updates accept `ChatTopicUpdate`, whose fields are optional.
    - Added room, user, and user-room collection operations

    #### Breaking Changes

    - Renamed request-body parameters from `resource` to `role`, `room`, `member`, `user`, `topic`, or `message`, matching the operation's resource. Positional calls are unchanged.
    - Renamed `ChatConversation.parent_room` to `room_id`. The JSON field remains `parentRoom`.
    - Removed the `continuation_token_parameter` argument from listing operations. Resume paging with `by_page(continuation_token=...)` on the returned `ItemPaged` or `AsyncItemPaged` instead.
    - Create or replace operations now accept dedicated `ChatRoleCreateOrReplace`, `ChatRoomCreateOrReplace`, `ChatRoomMemberCreateOrReplace`, and `ChatUserCreateOrReplace` (including `HumanChatUserCreateOrReplace`) request models instead of resource response models.
    - Message updates accept `ChatMessageUpdate`, whose fields are optional, instead of `ChatMessage`. Resource response model names are unchanged.
- Name: azure-data-ai
  Version: 1.1.0b1
  DisplayName: Data AI
  ServiceName: Inference
  VersionType: Beta
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-python/tree/azure-data-ai_1.1.0b1/sdk/dataai/azure-data-ai/CHANGELOG.md
  ChangelogContent: |-
    #### Features Added

    - Added synchronous and asynchronous `InferenceClient.get_embeddings` for text, search queries, and
    document images, using plain dictionaries in `inputs` or a complete request dictionary.
    - Added dense, multi-vector, and combined vector results, with float or base64 encoding.
    - Added Azure Blob image inputs and inline or linked result delivery.
    - Added embedding usage, truncation warnings, SAS lifetime warnings, and typed service errors.
    - Added support for service API version `2026-11-01-preview`, now the client default. Pass
    `api_version="2026-10-30"` to retain the generally available API version.
