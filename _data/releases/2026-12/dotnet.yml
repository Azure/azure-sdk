- Name: Azure.Data.AI
  Version: 1.1.0-beta.1
  DisplayName: Semantic Reranker
  ServiceName: Semantic Reranker
  VersionType: Beta
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-net/tree/Azure.Data.AI_1.1.0-beta.1/sdk/dataai/Azure.Data.AI/CHANGELOG.md
  ChangelogContent: |-
    #### Breaking Changes

    - The default service API version is now `2026-11-01-preview`. Select `InferenceClientOptions.ServiceVersion.V2026_10_30` explicitly to continue using the stable semantic reranking API.

    #### Features Added

    - Added multimodal embedding operations for text, queries, and document images, with dense, multi-vector, and combined results.
    - Added inline and link delivery, output encoding and numeric precision selection, and embedding usage and warnings.
    - Added flattened `GetEmbeddings` and `GetEmbeddingsAsync` methods; callers pass request settings directly rather than creating a request options object.
    - Added .NET overloads that accept anonymous objects or dictionaries as embedding inputs and return typed results, without requiring `EmbeddingInput` instances. Omitted input kinds default to text; PascalCase members and SDK content kinds are supported, and unknown or duplicate properties are rejected.
    - Added generic embedding result and usage models, with specialized multimodal implementations.
- Name: Azure.Storage.Blobs
  Version: 12.30.2
  DisplayName: Storage - Blobs
  ServiceName: Storage
  VersionType: Patch
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-net/tree/Azure.Storage.Blobs_12.30.2/sdk/storage/Azure.Storage.Blobs/CHANGELOG.md
  ChangelogContent: |-
    #### Bugs Fixed
    - Fixed SAS builder/client resource-name validation to use ordinal comparisons in `BlobBaseClient` and `BlobContainerClient`, so culture-equivalent but service-distinct Unicode names are rejected when generating SAS URIs.
    - Fixed an issue where `BlobClient.Upload(..., overwrite: false)` with upload checksum validation configured as `StorageChecksumAlgorithm.StorageCrc64` could throw `InvalidDataException` when the blob already existed. The operation now surfaces the expected `RequestFailedException` for `409 *AlreadyExists`.
    - Fixed client-side encryption v1 decryption of ranged downloads so the 16-byte IV is fully read even when the ciphertext stream returns short reads, and a truncated IV now fails instead of silently corrupting plaintext.
    - Fixed SAS timestamp handling for non-UTC `DateTimeOffset` values. SAS times are now normalized to UTC before formatting/signing, preventing unintended validity windows in st/se (Start Time, Expiry Time) and related delegation key fields. Affected APIs include:
    - `BlobBaseClient.GenerateSasUri(...)`
    - `BlobBaseClient.GenerateUserDelegationSasUri(...)`
    - `BlobContainerClient.GenerateSasUri(...)`
    - `BlobContainerClient.GenerateUserDelegationSasUri(...)`
    - `BlobServiceClient.GenerateAccountSasUri(...)`
    - `BlobSasBuilder`
