  ChangelogUrl: https://github.com/Azure/azure-sdk-for-java/tree/com.azure.resourcemanager+azure-resourcemanager-storagesync_1.0.0/sdk/storagesync/azure-resourcemanager-storagesync/CHANGELOG.md
