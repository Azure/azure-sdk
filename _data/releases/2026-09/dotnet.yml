- Name: Azure.Security.ConfidentialLedger
  Version: 2.0.0-beta.3
  DisplayName: Confidential Ledger
  ServiceName: Confidential Ledger
  VersionType: Beta
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-net/tree/Azure.Security.ConfidentialLedger_2.0.0-beta.3/sdk/confidentialledger/Azure.Security.ConfidentialLedger/CHANGELOG.md
  ChangelogContent: |-
    #### Breaking Changes

    - Changed `ConfidentialLedgerClientOptions.EnableArchivedCollectionFallback` to default to `false`. Callers that require `GetCurrentLedgerEntry` and `GetCurrentLedgerEntryAsync` to search ledger history after a collection-specific 404 must now explicitly opt in by setting the option to `true`.
