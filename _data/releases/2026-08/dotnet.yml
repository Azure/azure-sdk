- Name: Azure.Security.CodeTransparency
  Version: 1.0.0-beta.12
  DisplayName: Code Transparency
  ServiceName: Confidential Ledger
  VersionType: Beta
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-net/tree/Azure.Security.CodeTransparency_1.0.0-beta.12/sdk/confidentialledger/Azure.Security.CodeTransparency/CHANGELOG.md
  ChangelogContent: |-
    #### Bugs Fixed

    - Fixed asynchronous registration and receipt retrieval against a still-pending transaction. When a
    write is routed to a backup node the service replies with a redirect whose `Location` (for example
    `/entries/{entryId}`) omits the `api-version`. `CodeTransparencyRedirectPolicy` now carries the
    originating request's `api-version` onto followed `303`/`307`/`308` redirect targets, so the
    subsequent read stays on the versioned API instead of falling back to the service's unversioned
    (legacy) behavior. On the versioned API a read of a not-yet-committed entry is answered with a
    `302 Found` whose `Location` points back at the same entry URL; the followed read now treats that
    `302` as retriable, and the client's default retry settings were raised (more, exponentially
    backed-off retries starting at 200 ms) so the pipeline polls until the committed receipt (`200`).
    All retry and delay values remain overridable through `CodeTransparencyClientOptions.Retry`.
- Name: System.ClientModel
  Version: 1.15.0
  DisplayName: System.ClientModel
  ServiceName: Other
  VersionType: GA
  Hidden: false
  ChangelogUrl: https://github.com/Azure/azure-sdk-for-net/tree/System.ClientModel_1.15.0/sdk/core/System.ClientModel/CHANGELOG.md
  ChangelogContent: |-
    #### Features Added

    - Added sealed, one-shot `AsyncStreamingClientResult<T>` for asynchronous streaming responses, with factories for custom producers, server-sent events, and newline-delimited JSON.

    #### Bugs Fixed

    - Fixed an issue where response content logging could emit more bytes than were actually read when a non-buffered (streaming) response was read into a buffer larger than the response body. Previously, when the read began at offset 0, `MessageLoggingPolicy` logged the entire caller-supplied buffer — including the bytes past the response payload, which for a pooled buffer contain unrelated in-process content — and the configured `MessageContentSizeLimit` was not applied. Only the bytes that were read are now logged. ([#61399](https://github.com/Azure/azure-sdk-for-net/issues/61399))
